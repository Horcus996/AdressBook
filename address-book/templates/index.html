<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Address Book</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <header class="app-header">
    <h1>Address Book</h1>
    <p>EE308FZ Software Engineering - Extreme Programming Assignment</p>
    <div class="stats">
      <span>Total contacts: <strong id="stat-total">0</strong></span>
      <span>Favorites: <strong id="stat-fav">0</strong></span>
    </div>
  </header>

  <div class="toolbar">
    <div class="tabs">
      <button id="tab-all" class="active" onclick="setFilter('all')">All</button>
      <button id="tab-fav" onclick="setFilter('favorite')">Favorites</button>
    </div>
    <input id="search" class="search" type="text" placeholder="Search name, phone, email, social or address..." oninput="onSearch()" />
    <div class="actions">
      <button class="btn primary" onclick="openModal()">+ Add Contact</button>
      <button class="btn ghost" onclick="document.getElementById('import-file').click()">Import Excel</button>
      <button class="btn ghost" onclick="window.location.href='/api/export-contacts.xlsx'">Export Excel</button>
      <button class="btn ghost" onclick="window.location.href='/api/template.xlsx'">Download Template</button>
      <input id="import-file" type="file" accept=".xlsx" hidden onchange="onImport(event)" />
    </div>
  </div>

  <main id="grid" class="grid"></main>

  <!-- Add / Edit modal -->
  <div id="modal-mask" class="modal-mask" onclick="onMaskClick(event)">
    <div class="modal">
      <h2 id="modal-title">Add Contact</h2>
      <form id="contact-form" onsubmit="onSave(event)">
        <div class="form-row">
          <label for="f-name">Name *</label>
          <input id="f-name" type="text" required placeholder="Full name" />
        </div>

        <div class="form-row check-row">
          <input id="f-bookmarked" type="checkbox" />
          <label for="f-bookmarked">Mark as favorite / bookmark</label>
        </div>

        <div class="form-row">
          <label>Phone numbers</label>
          <div id="editor-phones" class="method-editor"></div>
          <button type="button" class="add-line" onclick="addMethodLine('phones')">+ Add phone</button>
        </div>

        <div class="form-row">
          <label>Email addresses</label>
          <div id="editor-emails" class="method-editor"></div>
          <button type="button" class="add-line" onclick="addMethodLine('emails')">+ Add email</button>
        </div>

        <div class="form-row">
          <label>Social accounts (WeChat / QQ / GitHub / Instagram ...)</label>
          <div id="editor-socials" class="method-editor"></div>
          <button type="button" class="add-line" onclick="addMethodLine('socials')">+ Add social account</button>
        </div>

        <div class="form-row">
          <label for="f-address">Postal address</label>
          <input id="f-address" type="text" placeholder="Street, city" />
        </div>

        <div class="form-row">
          <label for="f-note">Note</label>
          <textarea id="f-note" rows="2" placeholder="Relationship, company ..."></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn ghost" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn primary">Save Contact</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast"></div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
